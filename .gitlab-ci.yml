test-booking-service:
  stage: test
  image: eclipse-temurin:21-jdk
  variables:
    FF_NETWORK_PER_BUILD: "true"
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: bookingdb
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookingdb
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
  services:
    - name: postgres:16
      alias: postgres
  script:
    # BookingConcurrencyTest excluded from CI via build.gradle.kts (CI env var check)
    # — requires Docker-in-Docker (privileged runner mode), not currently
    # available on this runner. Run manually with `./gradlew test` locally
    # to verify the concurrency guarantee.
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U postgres; do echo "Waiting for postgres..."; sleep 2; done
    - cd booking-service
    - chmod +x gradlew
    - ./gradlew test
