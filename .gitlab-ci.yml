# .gitlab-ci.yml
# This defines the CI/CD pipeline that runs automatically on GitLab for
# every push. Two stages:
#   test   - each microservice's own job spins up a fresh Postgres and
#            runs its Gradle test suite against it.
#   deploy - (main branch only, and only if every test job above passes)
#            tells Render to redeploy each backend service by hitting
#            its Deploy Hook URL. Render itself builds the Docker image
#            from each service's Dockerfile and handles the actual
#            rollout - this job's only job is to trigger that, gated on
#            tests passing (Render's own git watch would otherwise
#            deploy independently of whether tests passed). The
#            frontend is NOT part of this pipeline at all - it's a
#            static build published by GitHub Pages' own workflow on the
#            mirrored repo.

stages:
  - test
  - deploy

test-user-service:
  stage: test
  image: eclipse-temurin:21-jdk   #a JDK 21 image, since these are Java/Spring Boot services
  variables:
    FF_NETWORK_PER_BUILD: "true"   #gives this job its own private Docker network, so the "postgres" service hostname resolves correctly
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: userdb   #the database this service's tests connect to
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb   #"postgres" here is the service alias below, not localhost
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
  services:
    - name: postgres:16   #GitLab spins this up as a linked container alongside the job
      alias: postgres   #the hostname other config in this job uses to reach it
  script:
    - apt-get update && apt-get install -y postgresql-client   #installs pg_isready, used just below
    - until pg_isready -h postgres -p 5432 -U postgres; do echo "Waiting for postgres..."; sleep 2; done   #don't run tests before the database container is actually accepting connections
    - cd user-service
    - chmod +x gradlew   #the checked-in wrapper script needs execute permission on Linux runners
    - ./gradlew test

