<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages serves this for any path it doesn't have a real
      // file for - which is every client-side route in this SPA
      // (React Router handles them, not the static host). This encodes
      // the real path as a query string and redirects to the app's
      // base URL, where index.html's own script decodes it back via
      // the History API before React Router ever sees a request.
      // Standard trick: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keeps "/vertere-bnb" (the project name) as the base

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
